<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Zone backdrop: a night workshop with a glowing forge, rising sparks, silhouetted tools, and an anvil, ember orange on charcoal">
  <!-- THE FORGE - original zone loading-screen art -->
  <defs>
    <linearGradient id="tf-room" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a090b"/>
      <stop offset="0.55" stop-color="#131010"/>
      <stop offset="0.85" stop-color="#1d1512"/>
      <stop offset="1" stop-color="#120d0b"/>
    </linearGradient>
    <radialGradient id="tf-heat" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.9"/>
      <stop offset="0.3" stop-color="#ff8c2a" stop-opacity="0.55"/>
      <stop offset="0.7" stop-color="#e05a1c" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#e05a1c" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tf-mouth" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff8c2a"/>
      <stop offset="0.45" stop-color="#f7671c"/>
      <stop offset="1" stop-color="#ffd166"/>
    </linearGradient>
    <radialGradient id="tf-emberdot" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ffdd8a" stop-opacity="0.95"/>
      <stop offset="0.4" stop-color="#ff8c2a" stop-opacity="0.7"/>
      <stop offset="1" stop-color="#ff5a00" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tf-beam" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050405"/>
      <stop offset="1" stop-color="#100b09"/>
    </linearGradient>
    <radialGradient id="tf-vig" cx="0.5" cy="0.48" r="0.76">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.58" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.62"/>
    </radialGradient>
    <linearGradient id="tf-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#050304" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#050304" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#030203" stop-opacity="0.96"/>
    </linearGradient>
    <filter id="tf-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="16"/></filter>
    <filter id="tf-soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="tf-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="23" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.4  0 0 0 0.6 0"/>
    </filter>
  </defs>

  <!-- workshop interior -->
  <rect width="1600" height="900" fill="url(#tf-room)"/>

  <!-- roof beams and posts -->
  <g fill="url(#tf-beam)">
    <polygon points="0,0 1600,0 1600,70 800,150 0,70"/>
    <rect x="120" y="60" width="46" height="620"/>
    <rect x="1430" y="60" width="46" height="620"/>
    <polygon points="120,120 560,64 560,92 120,150"/>
    <polygon points="1476,120 1040,64 1040,92 1476,150"/>
  </g>
  <!-- back wall boards -->
  <g stroke="#050405" stroke-width="4" opacity="0.6">
    <line x1="300" y1="130" x2="300" y2="620"/>
    <line x1="420" y1="118" x2="420" y2="620"/>
    <line x1="540" y1="108" x2="540" y2="620"/>
    <line x1="1060" y1="108" x2="1060" y2="620"/>
    <line x1="1180" y1="118" x2="1180" y2="620"/>
    <line x1="1300" y1="130" x2="1300" y2="620"/>
  </g>

  <!-- forge hearth, right of center -->
  <g>
    <ellipse cx="1120" cy="520" rx="360" ry="260" fill="url(#tf-heat)" opacity="0.55"/>
    <!-- chimney and hood -->
    <polygon points="1010,160 1230,160 1200,300 1040,300" fill="#0b0a0c"/>
    <rect x="1074" y="40" width="92" height="130" fill="#0b0a0c"/>
    <polygon points="1000,300 1240,300 1270,380 970,380" fill="#100d0f"/>
    <!-- brick mass -->
    <rect x="960" y="380" width="320" height="260" rx="10" fill="#171114"/>
    <g stroke="#0a0709" stroke-width="3" opacity="0.7">
      <line x1="960" y1="430" x2="1280" y2="430"/>
      <line x1="960" y1="480" x2="1280" y2="480"/>
      <line x1="960" y1="530" x2="1280" y2="530"/>
      <line x1="960" y1="580" x2="1280" y2="580"/>
      <line x1="1040" y1="380" x2="1040" y2="430"/><line x1="1120" y1="380" x2="1120" y2="430"/><line x1="1200" y1="380" x2="1200" y2="430"/>
      <line x1="1000" y1="430" x2="1000" y2="480"/><line x1="1080" y1="430" x2="1080" y2="480"/><line x1="1160" y1="430" x2="1160" y2="480"/><line x1="1240" y1="430" x2="1240" y2="480"/>
      <line x1="1040" y1="480" x2="1040" y2="530"/><line x1="1120" y1="480" x2="1120" y2="530"/><line x1="1200" y1="480" x2="1200" y2="530"/>
      <line x1="1000" y1="530" x2="1000" y2="580"/><line x1="1080" y1="530" x2="1080" y2="580"/><line x1="1160" y1="530" x2="1160" y2="580"/><line x1="1240" y1="530" x2="1240" y2="580"/>
    </g>
    <!-- glowing mouth -->
    <path d="M1030 640 L1030 520 Q1120 448 1210 520 L1210 640 Z" fill="url(#tf-mouth)"/>
    <path d="M1030 640 L1030 520 Q1120 448 1210 520 L1210 640 Z" fill="none" stroke="#050405" stroke-width="10"/>
    <ellipse cx="1120" cy="620" rx="76" ry="22" fill="#fff3c4" opacity="0.8"/>
    <circle cx="1120" cy="560" r="120" fill="url(#tf-heat)" opacity="0.7" filter="url(#tf-soft2)"/>
    <!-- coals -->
    <g>
      <ellipse cx="1074" cy="628" rx="16" ry="8" fill="#3a1c0a"/>
      <ellipse cx="1120" cy="634" rx="18" ry="9" fill="#4a2008"/>
      <ellipse cx="1164" cy="628" rx="15" ry="8" fill="#3a1c0a"/>
      <ellipse cx="1097" cy="622" rx="10" ry="5" fill="#ff8c2a" opacity="0.9"/>
      <ellipse cx="1146" cy="624" rx="9" ry="4.5" fill="#ffd166" opacity="0.85"/>
    </g>
    <!-- heat shimmer rising from chimney -->
    <ellipse cx="1120" cy="120" rx="60" ry="90" fill="#8a93a8" opacity="0.06" filter="url(#tf-soft)"/>
    <ellipse cx="1150" cy="50" rx="80" ry="70" fill="#8a93a8" opacity="0.05" filter="url(#tf-soft)"/>
  </g>

  <!-- tool rack on the left wall, silhouetted -->
  <g>
    <rect x="210" y="230" width="360" height="16" rx="6" fill="#050405"/>
    <!-- hammer -->
    <g transform="translate(268,246)">
      <rect x="-5" y="0" width="10" height="120" rx="4" fill="#0b0a0c"/>
      <rect x="-30" y="-4" width="60" height="26" rx="5" fill="#0b0a0c"/>
      <path d="M-30 -4 h60" stroke="#e05a1c" stroke-width="2" opacity="0.5"/>
    </g>
    <!-- tongs -->
    <g transform="translate(370,246)">
      <path d="M-8 0 C-16 60 -12 110 -2 138" stroke="#0b0a0c" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M8 0 C16 60 12 110 2 138" stroke="#0b0a0c" stroke-width="9" fill="none" stroke-linecap="round"/>
      <circle cx="0" cy="46" r="6" fill="#0b0a0c"/>
      <path d="M-6 6 C-10 40 -8 60 -3 74" stroke="#e05a1c" stroke-width="1.6" fill="none" opacity="0.4"/>
    </g>
    <!-- big wrench / spanner -->
    <g transform="translate(462,246)">
      <rect x="-5" y="6" width="10" height="112" rx="4" fill="#0b0a0c"/>
      <circle cx="0" cy="4" r="18" fill="#0b0a0c"/>
      <rect x="-7" y="-12" width="14" height="18" fill="#131010"/>
    </g>
    <!-- file -->
    <g transform="translate(536,246)">
      <polygon points="-6,0 6,0 3,104 -3,104" fill="#0b0a0c"/>
      <rect x="-4" y="104" width="8" height="22" rx="3" fill="#0b0a0c"/>
      <path d="M-3 10 l6 0 M-3 24 l6 0 M-3 38 l6 0 M-3 52 l6 0" stroke="#e05a1c" stroke-width="1.2" opacity="0.35"/>
    </g>
    <!-- horseshoes hung below -->
    <path d="M240 400 a22 22 0 1 0 44 0 l-8 0 a14 14 0 1 1 -28 0 Z" fill="#0b0a0c"/>
    <path d="M320 400 a22 22 0 1 0 44 0 l-8 0 a14 14 0 1 1 -28 0 Z" fill="#0b0a0c"/>
  </g>

  <!-- workbench, far left -->
  <g>
    <rect x="60" y="560" width="340" height="26" rx="5" fill="#0b0a0c"/>
    <rect x="84" y="586" width="26" height="150" fill="#0b0a0c"/>
    <rect x="330" y="586" width="26" height="150" fill="#0b0a0c"/>
    <rect x="130" y="534" width="90" height="26" rx="4" fill="#080709"/>
    <circle cx="280" cy="546" r="14" fill="#080709"/>
    <path d="M120 560 h250" stroke="#e05a1c" stroke-width="2" opacity="0.35"/>
  </g>

  <!-- floor -->
  <rect x="0" y="660" width="1600" height="240" fill="#0d0a0a"/>
  <ellipse cx="1120" cy="680" rx="420" ry="60" fill="url(#tf-heat)" opacity="0.4"/>
  <ellipse cx="700" cy="720" rx="500" ry="70" fill="#1d1512" opacity="0.8"/>
  <g stroke="#050405" stroke-width="3" opacity="0.5">
    <line x1="0" y1="700" x2="1600" y2="690"/>
    <line x1="0" y1="756" x2="1600" y2="742"/>
    <line x1="0" y1="820" x2="1600" y2="800"/>
  </g>

  <!-- focal anvil on an oak stump, center-left, rim-lit by the forge -->
  <g>
    <ellipse cx="640" cy="800" rx="220" ry="34" fill="#000000" opacity="0.5"/>
    <!-- stump -->
    <path d="M552 700 L560 800 L724 800 L732 700 Z" fill="#120c08"/>
    <ellipse cx="642" cy="700" rx="90" ry="20" fill="#1c130c"/>
    <path d="M580 720 L576 796 M700 722 L706 796" stroke="#060404" stroke-width="4" opacity="0.7"/>
    <!-- anvil body -->
    <path d="M520 610 C560 596 600 590 648 590 L780 590 C806 590 824 604 824 618 C824 630 810 638 788 640 L744 644 L752 664 L732 688 L560 688 L544 664 L556 644 C532 642 512 626 520 610 Z" fill="#0a0908"/>
    <rect x="560" y="560" width="176" height="34" rx="6" fill="#0a0908"/>
    <!-- horn -->
    <path d="M520 610 C480 600 452 596 430 600 C452 582 492 578 528 588 Z" fill="#0a0908"/>
    <!-- hot iron bar on the face -->
    <rect x="596" y="548" width="150" height="12" rx="5" fill="#ff8c2a"/>
    <rect x="596" y="548" width="80" height="12" rx="5" fill="#ffd166"/>
    <rect x="716" y="550" width="60" height="8" rx="4" fill="#7c3410"/>
    <circle cx="640" cy="552" r="46" fill="url(#tf-heat)" opacity="0.6"/>
    <!-- rim light from the forge, right side -->
    <path d="M736 560 L736 594 L788 590 C810 592 824 606 824 618" fill="none" stroke="#ff8c2a" stroke-width="3" opacity="0.7"/>
    <path d="M732 688 L744 644" stroke="#e05a1c" stroke-width="2.4" opacity="0.55"/>
    <path d="M560 560 h176" stroke="#ffd166" stroke-width="2" opacity="0.5"/>
  </g>

  <!-- raised hammer silhouette above the anvil -->
  <g transform="rotate(-34 900 380)">
    <rect x="892" y="380" width="16" height="190" rx="7" fill="#0a0908"/>
    <rect x="852" y="344" width="96" height="44" rx="8" fill="#0a0908"/>
    <path d="M852 344 h96" stroke="#ff8c2a" stroke-width="2.4" opacity="0.6"/>
  </g>

  <!-- sparks arcing off the anvil -->
  <g>
    <circle cx="672" cy="500" r="3" fill="#ffd166"/>
    <circle cx="712" cy="462" r="2.4" fill="#ffb066"/>
    <circle cx="600" cy="470" r="2.6" fill="#ffd166"/>
    <circle cx="748" cy="430" r="2" fill="#ff8c2a"/>
    <circle cx="560" cy="430" r="2" fill="#ffb066"/>
    <circle cx="640" cy="410" r="1.8" fill="#ffd166"/>
    <circle cx="780" cy="500" r="2.2" fill="#ff8c2a"/>
    <circle cx="700" cy="380" r="1.6" fill="#ffd166"/>
    <circle cx="672" cy="500" r="9" fill="url(#tf-emberdot)"/>
    <circle cx="712" cy="462" r="7" fill="url(#tf-emberdot)"/>
    <circle cx="600" cy="470" r="8" fill="url(#tf-emberdot)"/>
    <circle cx="748" cy="430" r="6" fill="url(#tf-emberdot)"/>
    <path d="M660 540 Q668 516 672 502 M690 536 Q702 496 712 464 M624 534 Q610 500 600 474" stroke="#ffd166" stroke-width="1.2" fill="none" opacity="0.4"/>
  </g>
  <!-- embers drifting up from the forge mouth -->
  <g>
    <circle cx="1096" cy="470" r="2.4" fill="#ffd166"/>
    <circle cx="1150" cy="430" r="2" fill="#ffb066"/>
    <circle cx="1120" cy="380" r="1.8" fill="#ff8c2a"/>
    <circle cx="1180" cy="340" r="1.6" fill="#ffd166"/>
    <circle cx="1080" cy="330" r="1.4" fill="#ffb066"/>
    <circle cx="1096" cy="470" r="8" fill="url(#tf-emberdot)"/>
    <circle cx="1150" cy="430" r="6" fill="url(#tf-emberdot)"/>
    <circle cx="1120" cy="380" r="5" fill="url(#tf-emberdot)"/>
  </g>

  <!-- scattered ember specks on the floor -->
  <g>
    <rect x="880" y="720" width="16" height="16" fill="url(#tf-emberdot)"/>
    <rect x="960" y="760" width="12" height="12" fill="url(#tf-emberdot)"/>
    <rect x="1060" y="700" width="18" height="18" fill="url(#tf-emberdot)"/>
    <rect x="500" y="770" width="12" height="12" fill="url(#tf-emberdot)"/>
    <rect x="770" y="750" width="10" height="10" fill="url(#tf-emberdot)"/>
    <rect x="1240" y="730" width="14" height="14" fill="url(#tf-emberdot)"/>
  </g>

  <!-- grain, vignette, progress-bar band -->
  <rect width="1600" height="900" filter="url(#tf-grain)" opacity="0.07"/>
  <rect width="1600" height="900" fill="url(#tf-vig)"/>
  <rect x="0" y="760" width="1600" height="140" fill="url(#tf-band)"/>
</svg>
