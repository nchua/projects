[project]
name = "bookgen"
version = "0.1.0"
description = "Book generation pipeline for serialized, personalized children's picture books (SPEC.md)."
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2",
    "typer>=0.12",
    "pyyaml>=6",
    "httpx2>=2",
    "anthropic>=2.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
book = "bookgen.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["bookgen*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ANN", "D"]
ignore = ["D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"
