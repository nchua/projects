name: Deploy Training Calendar to GitHub Pages

on:
  push:
    branches: [main, claude/training-calendar-pwa-p7wm84]
    paths: ["training-calendar/**", ".github/workflows/deploy-training-calendar.yml"]
  workflow_dispatch:

permissions:
  contents: write
  pages: write

concurrency:
  group: pages-deploy
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish training-calendar/ to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./training-calendar
          force_orphan: true
      - name: Enable GitHub Pages from gh-pages branch (no-op once enabled)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api "repos/${{ github.repository }}/pages" \
            -X POST -f "source[branch]=gh-pages" -f "source[path]=/" \
            || echo "Pages already enabled (or enable failed) — see above"
