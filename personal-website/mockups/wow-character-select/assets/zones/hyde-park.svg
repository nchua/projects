<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Zone backdrop: collegiate gothic towers behind a tennis court fence silhouette under an autumn dusk, maroon and slate">
  <!-- HYDE PARK - original zone loading-screen art -->
  <defs>
    <linearGradient id="hp-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#232833"/>
      <stop offset="0.4" stop-color="#3a3442"/>
      <stop offset="0.68" stop-color="#5c2430"/>
      <stop offset="0.86" stop-color="#87402f"/>
      <stop offset="1" stop-color="#b06a35"/>
    </linearGradient>
    <radialGradient id="hp-sunset" cx="0.42" cy="0.86" r="0.55">
      <stop offset="0" stop-color="#e8a558" stop-opacity="0.6"/>
      <stop offset="0.5" stop-color="#b06a35" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#b06a35" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="hp-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a3038"/>
      <stop offset="1" stop-color="#3a262d"/>
    </linearGradient>
    <linearGradient id="hp-main" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#221c26"/>
      <stop offset="1" stop-color="#171219"/>
    </linearGradient>
    <linearGradient id="hp-ground" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#1f1a20"/>
      <stop offset="1" stop-color="#0f0c10"/>
    </linearGradient>
    <radialGradient id="hp-vig" cx="0.5" cy="0.46" r="0.76">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.6" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.58"/>
    </radialGradient>
    <linearGradient id="hp-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#070508" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#070508" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#040305" stop-opacity="0.95"/>
    </linearGradient>
    <pattern id="hp-chainlink" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M0 17 L17 0 M17 0 L34 17 M0 17 L17 34 M17 34 L34 17" stroke="#0c0a0e" stroke-width="2.4" fill="none"/>
    </pattern>
    <filter id="hp-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="hp-soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="hp-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="31" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.55  0 0 0 0 0.45  0 0 0 0 0.45  0 0 0 0.6 0"/>
    </filter>
  </defs>

  <!-- dusk sky -->
  <rect width="1600" height="900" fill="url(#hp-sky)"/>
  <rect width="1600" height="900" fill="url(#hp-sunset)"/>
  <ellipse cx="380" cy="220" rx="420" ry="52" fill="#2b2f3a" opacity="0.55" filter="url(#hp-soft)"/>
  <ellipse cx="1200" cy="140" rx="480" ry="60" fill="#232833" opacity="0.6" filter="url(#hp-soft)"/>
  <ellipse cx="820" cy="330" rx="520" ry="44" fill="#5c2430" opacity="0.4" filter="url(#hp-soft)"/>
  <circle cx="290" cy="110" r="1.3" fill="#dbe3f2" opacity="0.45"/>
  <circle cx="520" cy="70" r="1" fill="#dbe3f2" opacity="0.35"/>
  <circle cx="1330" cy="80" r="1.2" fill="#dbe3f2" opacity="0.4"/>
  <circle cx="1480" cy="150" r="1" fill="#dbe3f2" opacity="0.3"/>

  <!-- far quad rooftops -->
  <g fill="url(#hp-far)" opacity="0.85">
    <polygon points="0,600 0,520 90,520 110,494 130,520 220,520 220,600"/>
    <polygon points="240,600 240,540 330,540 350,510 370,540 460,540 460,600"/>
    <polygon points="1180,600 1180,536 1268,536 1288,508 1308,536 1400,536 1400,600"/>
    <polygon points="1420,600 1420,522 1512,522 1532,494 1552,522 1600,522 1600,600"/>
    <rect x="470" y="556" width="180" height="50"/>
    <rect x="1000" y="556" width="170" height="50"/>
  </g>

  <!-- main gothic tower, focal, left of center -->
  <g fill="url(#hp-main)">
    <!-- tower shaft -->
    <rect x="560" y="230" width="180" height="400"/>
    <!-- crenellated crown -->
    <rect x="548" y="214" width="204" height="26"/>
    <rect x="548" y="188" width="18" height="30"/>
    <rect x="586" y="188" width="18" height="30"/>
    <rect x="624" y="188" width="18" height="30"/>
    <rect x="662" y="188" width="18" height="30"/>
    <rect x="700" y="188" width="18" height="30"/>
    <rect x="734" y="188" width="18" height="30"/>
    <!-- corner pinnacles -->
    <polygon points="548,214 557,142 566,214"/>
    <polygon points="734,214 743,142 752,214"/>
    <polygon points="612,188 621,120 630,188"/>
    <polygon points="670,188 679,120 688,188"/>
    <!-- attached hall, gabled -->
    <polygon points="740,630 740,470 900,470 900,630"/>
    <polygon points="736,470 820,398 904,470"/>
    <polygon points="884,430 884,380 900,380 900,444"/>
    <!-- cloister wing left -->
    <rect x="410" y="500" width="150" height="130"/>
    <polygon points="404,500 485,444 566,500"/>
  </g>

  <!-- tower detail -->
  <g>
    <!-- tall arched windows, faint warm light -->
    <path d="M600 300 L600 260 Q614 244 628 260 L628 300 Z" fill="#e8a558" opacity="0.45"/>
    <path d="M672 300 L672 260 Q686 244 700 260 L700 300 Z" fill="#e8a558" opacity="0.35"/>
    <path d="M600 420 L600 372 Q614 356 628 372 L628 420 Z" fill="#d98a3f" opacity="0.3"/>
    <path d="M672 420 L672 372 Q686 356 700 372 L700 420 Z" fill="#d98a3f" opacity="0.4"/>
    <path d="M636 560 L636 500 Q650 480 664 500 L664 560 Z" fill="#e8a558" opacity="0.5"/>
    <!-- stone string courses -->
    <rect x="560" y="330" width="180" height="5" fill="#0e0b10" opacity="0.8"/>
    <rect x="560" y="450" width="180" height="5" fill="#0e0b10" opacity="0.8"/>
    <!-- hall rose window and lancets -->
    <circle cx="820" cy="452" r="17" fill="#d98a3f" opacity="0.45"/>
    <circle cx="820" cy="452" r="17" fill="none" stroke="#0e0b10" stroke-width="3"/>
    <path d="M780 560 L780 522 Q790 508 800 522 L800 560 Z" fill="#e8a558" opacity="0.35"/>
    <path d="M840 560 L840 522 Q850 508 860 522 L860 560 Z" fill="#e8a558" opacity="0.3"/>
    <!-- cloister arches -->
    <path d="M430 610 L430 566 Q444 548 458 566 L458 610 Z" fill="#87402f" opacity="0.35"/>
    <path d="M478 610 L478 566 Q492 548 506 566 L506 610 Z" fill="#87402f" opacity="0.3"/>
    <path d="M526 610 L526 566 Q540 548 554 566 L554 610 Z" fill="#87402f" opacity="0.35"/>
    <!-- dusk rim light on the tower's sun side -->
    <rect x="556" y="230" width="4" height="400" fill="#e8a558" opacity="0.4"/>
    <polygon points="548,214 557,142 561,214" fill="#e8a558" opacity="0.3"/>
  </g>

  <!-- secondary spire, right side -->
  <g fill="#241d28">
    <rect x="1130" y="380" width="90" height="240"/>
    <polygon points="1120,380 1175,270 1230,380"/>
    <rect x="1118" y="374" width="114" height="12"/>
    <polygon points="1175,270 1175,236 1181,236 1181,272"/>
    <path d="M1152 470 L1152 432 Q1163 418 1174 432 L1174 470 Z" fill="#d98a3f" opacity="0.3"/>
    <path d="M1186 520 L1186 486 Q1196 474 1206 486 L1206 520 Z" fill="#d98a3f" opacity="0.25"/>
  </g>

  <!-- autumn tree line -->
  <g>
    <ellipse cx="180" cy="560" rx="190" ry="90" fill="#3d2028"/>
    <ellipse cx="90" cy="520" rx="130" ry="70" fill="#4a2430"/>
    <ellipse cx="330" cy="580" rx="120" ry="60" fill="#33202a"/>
    <ellipse cx="990" cy="580" rx="160" ry="76" fill="#3d2028"/>
    <ellipse cx="1080" cy="550" rx="110" ry="58" fill="#4a2430"/>
    <ellipse cx="1420" cy="570" rx="200" ry="88" fill="#33202a"/>
    <ellipse cx="1530" cy="530" rx="130" ry="66" fill="#432631"/>
    <!-- amber-lit crowns catching the last sun -->
    <ellipse cx="120" cy="500" rx="80" ry="34" fill="#8a4a33" opacity="0.55"/>
    <ellipse cx="1000" cy="540" rx="90" ry="34" fill="#8a4a33" opacity="0.45"/>
    <ellipse cx="1500" cy="510" rx="90" ry="36" fill="#7c3e30" opacity="0.5"/>
  </g>

  <!-- lawn / court ground -->
  <rect x="0" y="620" width="1600" height="280" fill="url(#hp-ground)"/>
  <ellipse cx="800" cy="640" rx="820" ry="46" fill="#5c2430" opacity="0.25" filter="url(#hp-soft2)"/>
  <!-- court surface lines, faint -->
  <g stroke="#4a4f5e" stroke-width="3" opacity="0.4" fill="none">
    <path d="M240 900 L440 690 L1160 690 L1360 900"/>
    <path d="M340 795 L1260 795"/>
    <line x1="800" y1="690" x2="800" y2="900"/>
  </g>

  <!-- tennis court fence silhouette, foreground -->
  <g>
    <!-- chain-link mesh -->
    <rect x="0" y="330" width="1600" height="420" fill="url(#hp-chainlink)" opacity="0.85"/>
    <!-- rails and posts -->
    <rect x="0" y="322" width="1600" height="10" fill="#0a080c"/>
    <rect x="0" y="744" width="1600" height="10" fill="#0a080c"/>
    <rect x="0" y="530" width="1600" height="6" fill="#0a080c" opacity="0.85"/>
    <rect x="70" y="322" width="16" height="436" fill="#0a080c"/>
    <rect x="440" y="322" width="16" height="436" fill="#0a080c"/>
    <rect x="810" y="322" width="16" height="436" fill="#0a080c"/>
    <rect x="1180" y="322" width="16" height="436" fill="#0a080c"/>
    <rect x="1540" y="322" width="16" height="436" fill="#0a080c"/>
    <!-- post caps -->
    <circle cx="78" cy="320" r="9" fill="#0a080c"/>
    <circle cx="448" cy="320" r="9" fill="#0a080c"/>
    <circle cx="818" cy="320" r="9" fill="#0a080c"/>
    <circle cx="1188" cy="320" r="9" fill="#0a080c"/>
    <circle cx="1548" cy="320" r="9" fill="#0a080c"/>
    <!-- dusk glint along the top rail -->
    <rect x="0" y="320" width="1600" height="2.5" fill="#e8a558" opacity="0.4"/>
  </g>

  <!-- a racquet leaning on the fence, bottom left -->
  <g transform="rotate(-18 210 720)">
    <ellipse cx="210" cy="640" rx="40" ry="54" fill="none" stroke="#0a080c" stroke-width="10"/>
    <line x1="210" y1="694" x2="210" y2="790" stroke="#0a080c" stroke-width="12" stroke-linecap="round"/>
    <line x1="192" y1="620" x2="228" y2="620" stroke="#3a3442" stroke-width="1.6" opacity="0.7"/>
    <line x1="190" y1="644" x2="230" y2="644" stroke="#3a3442" stroke-width="1.6" opacity="0.7"/>
    <line x1="194" y1="666" x2="226" y2="666" stroke="#3a3442" stroke-width="1.6" opacity="0.7"/>
    <line x1="210" y1="592" x2="210" y2="690" stroke="#3a3442" stroke-width="1.6" opacity="0.7"/>
    <line x1="196" y1="596" x2="196" y2="684" stroke="#3a3442" stroke-width="1.4" opacity="0.6"/>
    <line x1="224" y1="596" x2="224" y2="684" stroke="#3a3442" stroke-width="1.4" opacity="0.6"/>
  </g>
  <!-- tennis ball at rest -->
  <circle cx="330" cy="836" r="12" fill="#8f9a3d"/>
  <path d="M320 828 a14 14 0 0 1 20 16" fill="none" stroke="#c9cf8a" stroke-width="1.8" opacity="0.8"/>

  <!-- falling autumn leaves -->
  <g>
    <path d="M500 240 q10 -12 22 -4 q-2 14 -14 18 q-10 -4 -8 -14 Z" fill="#8a4a33" opacity="0.8"/>
    <path d="M950 190 q9 -11 20 -4 q-2 13 -13 16 q-9 -3 -7 -12 Z" fill="#7c3e30" opacity="0.7"/>
    <path d="M1290 260 q8 -10 18 -3 q-2 12 -12 15 q-8 -3 -6 -12 Z" fill="#a35b2e" opacity="0.7"/>
    <path d="M380 420 q8 -10 18 -3 q-2 12 -12 15 q-8 -3 -6 -12 Z" fill="#8a4a33" opacity="0.6"/>
    <path d="M1060 380 q7 -9 16 -3 q-1 11 -11 13 q-7 -2 -5 -10 Z" fill="#7c3e30" opacity="0.6"/>
  </g>

  <!-- grain, vignette, progress-bar band -->
  <rect width="1600" height="900" filter="url(#hp-grain)" opacity="0.06"/>
  <rect width="1600" height="900" fill="url(#hp-vig)"/>
  <rect x="0" y="760" width="1600" height="140" fill="url(#hp-band)"/>
</svg>
