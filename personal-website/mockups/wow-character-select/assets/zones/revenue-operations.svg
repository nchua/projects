<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900" role="img" aria-label="Zone backdrop: a gleaming citadel skyline at dusk, gold light on navy, with rising chart-like beams of light">
  <!-- REVENUE OPERATIONS - original zone loading-screen art -->
  <defs>
    <linearGradient id="ro-sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#05081a"/>
      <stop offset="0.42" stop-color="#0d1734"/>
      <stop offset="0.72" stop-color="#1c2b55"/>
      <stop offset="0.9" stop-color="#3d3a52"/>
      <stop offset="1" stop-color="#6a5334"/>
    </linearGradient>
    <radialGradient id="ro-duskglow" cx="0.5" cy="0.78" r="0.62">
      <stop offset="0" stop-color="#f0b64e" stop-opacity="0.5"/>
      <stop offset="0.45" stop-color="#c98e3a" stop-opacity="0.2"/>
      <stop offset="1" stop-color="#c98e3a" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ro-far" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3560"/>
      <stop offset="1" stop-color="#1b2647"/>
    </linearGradient>
    <linearGradient id="ro-mid" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#131d3c"/>
      <stop offset="1" stop-color="#0c1329"/>
    </linearGradient>
    <linearGradient id="ro-near" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0a0f22"/>
      <stop offset="1" stop-color="#050814"/>
    </linearGradient>
    <linearGradient id="ro-beam" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#ffd166" stop-opacity="0.42"/>
      <stop offset="0.55" stop-color="#ffd166" stop-opacity="0.12"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </linearGradient>
    <radialGradient id="ro-beacon" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#fff3c4" stop-opacity="0.95"/>
      <stop offset="0.35" stop-color="#ffd166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#ffd166" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="ro-vig" cx="0.5" cy="0.44" r="0.75">
      <stop offset="0" stop-color="#000000" stop-opacity="0"/>
      <stop offset="0.66" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.55"/>
    </radialGradient>
    <linearGradient id="ro-band" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#02030a" stop-opacity="0"/>
      <stop offset="0.55" stop-color="#02030a" stop-opacity="0.78"/>
      <stop offset="1" stop-color="#010207" stop-opacity="0.95"/>
    </linearGradient>
    <filter id="ro-soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
    <filter id="ro-soft2" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="5"/></filter>
    <filter id="ro-grain" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency="0.8" numOctaves="2" seed="7" stitchTiles="stitch"/>
      <feColorMatrix type="matrix" values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 0 0 0.55  0 0 0 0.6 0"/>
    </filter>
  </defs>

  <!-- sky -->
  <rect width="1600" height="900" fill="url(#ro-sky)"/>
  <rect width="1600" height="900" fill="url(#ro-duskglow)"/>
  <ellipse cx="820" cy="640" rx="720" ry="180" fill="#f0b64e" opacity="0.14" filter="url(#ro-soft)"/>
  <ellipse cx="300" cy="200" rx="360" ry="60" fill="#1c2b55" opacity="0.5" filter="url(#ro-soft)"/>
  <ellipse cx="1330" cy="150" rx="420" ry="66" fill="#141f42" opacity="0.55" filter="url(#ro-soft)"/>
  <circle cx="240" cy="120" r="1.4" fill="#dbe3f2" opacity="0.5"/>
  <circle cx="430" cy="70" r="1.1" fill="#dbe3f2" opacity="0.4"/>
  <circle cx="1180" cy="90" r="1.3" fill="#dbe3f2" opacity="0.45"/>
  <circle cx="1420" cy="60" r="1" fill="#dbe3f2" opacity="0.4"/>
  <circle cx="960" cy="110" r="1.2" fill="#dbe3f2" opacity="0.4"/>

  <!-- chart-like light beams climbing up and to the right -->
  <g>
    <rect x="330" y="470" width="46" height="250" fill="url(#ro-beam)"/>
    <rect x="470" y="430" width="46" height="290" fill="url(#ro-beam)"/>
    <rect x="610" y="360" width="46" height="360" fill="url(#ro-beam)"/>
    <rect x="890" y="300" width="46" height="420" fill="url(#ro-beam)"/>
    <rect x="1040" y="330" width="46" height="390" fill="url(#ro-beam)"/>
    <rect x="1180" y="230" width="46" height="490" fill="url(#ro-beam)"/>
    <polyline points="353,470 493,430 633,360 800,250 913,300 1063,330 1203,230 1370,150"
      fill="none" stroke="#ffd166" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"
      opacity="0.55" filter="url(#ro-soft2)"/>
    <polyline points="353,470 493,430 633,360 800,250 913,300 1063,330 1203,230 1370,150"
      fill="none" stroke="#fff3c4" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" opacity="0.7"/>
    <circle cx="353" cy="470" r="5" fill="#ffd166" opacity="0.8"/>
    <circle cx="633" cy="360" r="5" fill="#ffd166" opacity="0.8"/>
    <circle cx="913" cy="300" r="5" fill="#ffd166" opacity="0.8"/>
    <circle cx="1203" cy="230" r="5" fill="#ffd166" opacity="0.8"/>
    <circle cx="1370" cy="150" r="7" fill="#fff3c4" opacity="0.9"/>
    <circle cx="1370" cy="150" r="26" fill="url(#ro-beacon)"/>
  </g>

  <!-- far skyline -->
  <g fill="#222f58" opacity="0.85">
    <rect x="0" y="560" width="120" height="180"/>
    <rect x="130" y="520" width="90" height="220"/>
    <rect x="250" y="575" width="110" height="165"/>
    <rect x="380" y="540" width="70" height="200"/>
    <rect x="1150" y="545" width="95" height="195"/>
    <rect x="1270" y="515" width="80" height="225"/>
    <rect x="1380" y="560" width="120" height="180"/>
    <rect x="1510" y="530" width="90" height="210"/>
    <polygon points="165,520 175,488 185,520"/>
    <polygon points="1300,515 1310,480 1320,515"/>
  </g>

  <!-- mid skyline -->
  <g fill="url(#ro-mid)">
    <rect x="60" y="470" width="130" height="330"/>
    <rect x="220" y="430" width="100" height="370"/>
    <polygon points="220,430 270,398 320,430"/>
    <rect x="350" y="500" width="150" height="300"/>
    <rect x="530" y="450" width="90" height="350"/>
    <rect x="980" y="440" width="110" height="360"/>
    <rect x="1120" y="480" width="140" height="320"/>
    <rect x="1290" y="420" width="95" height="380"/>
    <polygon points="1290,420 1337,384 1385,420"/>
    <rect x="1420" y="465" width="180" height="335"/>
  </g>
  <!-- mid windows -->
  <g fill="#e8b455" opacity="0.55">
    <rect x="85" y="495" width="8" height="12"/><rect x="112" y="495" width="8" height="12"/><rect x="139" y="520" width="8" height="12"/>
    <rect x="85" y="548" width="8" height="12"/><rect x="139" y="575" width="8" height="12"/><rect x="112" y="602" width="8" height="12"/>
    <rect x="245" y="455" width="8" height="12"/><rect x="272" y="482" width="8" height="12"/><rect x="245" y="530" width="8" height="12"/><rect x="290" y="560" width="8" height="12"/>
    <rect x="380" y="525" width="8" height="12"/><rect x="420" y="552" width="8" height="12"/><rect x="455" y="525" width="8" height="12"/><rect x="398" y="596" width="8" height="12"/>
    <rect x="552" y="475" width="8" height="12"/><rect x="580" y="512" width="8" height="12"/><rect x="552" y="556" width="8" height="12"/>
    <rect x="1005" y="465" width="8" height="12"/><rect x="1040" y="492" width="8" height="12"/><rect x="1005" y="540" width="8" height="12"/><rect x="1062" y="565" width="8" height="12"/>
    <rect x="1150" y="508" width="8" height="12"/><rect x="1190" y="535" width="8" height="12"/><rect x="1225" y="508" width="8" height="12"/>
    <rect x="1315" y="448" width="8" height="12"/><rect x="1348" y="475" width="8" height="12"/><rect x="1315" y="522" width="8" height="12"/>
    <rect x="1450" y="490" width="8" height="12"/><rect x="1490" y="517" width="8" height="12"/><rect x="1530" y="490" width="8" height="12"/><rect x="1470" y="565" width="8" height="12"/>
  </g>

  <!-- focal citadel tower -->
  <g>
    <ellipse cx="800" cy="360" rx="150" ry="200" fill="url(#ro-beacon)" opacity="0.5"/>
    <polygon points="740,800 748,330 800,268 852,330 860,800" fill="#0b1126"/>
    <polygon points="800,268 800,800 860,800 852,330" fill="#080d1e"/>
    <polygon points="782,330 800,180 818,330" fill="#0b1126"/>
    <rect x="796" y="150" width="8" height="60" fill="#0b1126"/>
    <circle cx="800" cy="146" r="9" fill="#fff3c4"/>
    <circle cx="800" cy="146" r="40" fill="url(#ro-beacon)"/>
    <polygon points="700,800 706,470 740,430 740,800" fill="#0d1430"/>
    <polygon points="900,800 894,470 860,430 860,800" fill="#070c1a"/>
    <rect x="712" y="490" width="20" height="240" fill="#0d1430"/>
    <rect x="868" y="490" width="20" height="240" fill="#060a17"/>
    <!-- gold window seams up the tower -->
    <g fill="#ffd166" opacity="0.8">
      <rect x="796" y="320" width="8" height="20"/>
      <rect x="784" y="372" width="7" height="16"/><rect x="809" y="372" width="7" height="16"/>
      <rect x="784" y="420" width="7" height="16"/><rect x="809" y="420" width="7" height="16"/>
      <rect x="778" y="470" width="7" height="16"/><rect x="796" y="470" width="8" height="16"/><rect x="815" y="470" width="7" height="16"/>
      <rect x="778" y="524" width="7" height="16"/><rect x="815" y="524" width="7" height="16"/>
      <rect x="772" y="580" width="7" height="16"/><rect x="796" y="580" width="8" height="16"/><rect x="821" y="580" width="7" height="16"/>
      <rect x="772" y="640" width="7" height="16"/><rect x="821" y="640" width="7" height="16"/>
      <rect x="766" y="700" width="7" height="16"/><rect x="796" y="700" width="8" height="16"/><rect x="827" y="700" width="7" height="16"/>
    </g>
    <g fill="#c98e3a" opacity="0.5">
      <rect x="716" y="510" width="6" height="12"/><rect x="716" y="560" width="6" height="12"/><rect x="716" y="616" width="6" height="12"/>
      <rect x="876" y="510" width="6" height="12"/><rect x="876" y="560" width="6" height="12"/><rect x="876" y="616" width="6" height="12"/>
    </g>
  </g>

  <!-- near skyline, darkest -->
  <g fill="url(#ro-near)">
    <rect x="-20" y="620" width="220" height="280"/>
    <polygon points="200,900 200,600 260,570 320,600 320,900"/>
    <rect x="340" y="650" width="180" height="250"/>
    <rect x="545" y="610" width="130" height="290"/>
    <polygon points="545,610 610,575 675,610"/>
    <rect x="920" y="620" width="140" height="280"/>
    <polygon points="920,620 990,585 1060,620"/>
    <rect x="1085" y="655" width="190" height="245"/>
    <rect x="1300" y="605" width="120" height="295"/>
    <rect x="1440" y="645" width="180" height="255"/>
  </g>
  <g fill="#f4c860" opacity="0.7">
    <rect x="30" y="655" width="9" height="14"/><rect x="70" y="682" width="9" height="14"/><rect x="120" y="655" width="9" height="14"/>
    <rect x="235" y="630" width="9" height="14"/><rect x="275" y="660" width="9" height="14"/>
    <rect x="378" y="685" width="9" height="14"/><rect x="430" y="712" width="9" height="14"/><rect x="478" y="685" width="9" height="14"/>
    <rect x="575" y="645" width="9" height="14"/><rect x="625" y="672" width="9" height="14"/>
    <rect x="952" y="655" width="9" height="14"/><rect x="1002" y="682" width="9" height="14"/>
    <rect x="1120" y="690" width="9" height="14"/><rect x="1175" y="717" width="9" height="14"/><rect x="1228" y="690" width="9" height="14"/>
    <rect x="1330" y="640" width="9" height="14"/><rect x="1378" y="668" width="9" height="14"/>
    <rect x="1475" y="680" width="9" height="14"/><rect x="1530" y="707" width="9" height="14"/>
  </g>

  <!-- low haze over the rooftops -->
  <ellipse cx="800" cy="810" rx="900" ry="120" fill="#0d1734" opacity="0.65" filter="url(#ro-soft)"/>

  <!-- grain, vignette, progress-bar band -->
  <rect width="1600" height="900" filter="url(#ro-grain)" opacity="0.06"/>
  <rect width="1600" height="900" fill="url(#ro-vig)"/>
  <rect x="0" y="760" width="1600" height="140" fill="url(#ro-band)"/>
</svg>
