name: Print
options:
  bundleIdPrefix: com.nickchua
  deploymentTarget:
    iOS: "26.0"
packages:
  FilmCore:
    path: FilmCore
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: D69T4MH7XQ
    CODE_SIGN_STYLE: Automatic
targets:
  Print:
    type: application
    platform: iOS
    sources: [Print]
    dependencies:
      - package: FilmCore
    settings:
      base:
        PRODUCT_NAME: Print
        PRODUCT_BUNDLE_IDENTIFIER: com.nickchua.print
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        INFOPLIST_KEY_CFBundleDisplayName: Print
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_UIUserInterfaceStyle: Dark
        INFOPLIST_KEY_NSPhotoLibraryAddUsageDescription: Print saves the photos you develop to your library.
  PrintUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [PrintUITests]
    dependencies:
      - target: Print
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.nickchua.print.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Print
schemes:
  Print:
    build:
      targets:
        Print: all
    test:
      targets: [PrintUITests]
